<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Infinite Echoes in The Infinite Abyss — game encyclopedia">
<title>Infinite Echoes — Encyclopedia</title>
<link rel="stylesheet" href="styles.css">

<body>
<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
<div class="app">
